<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f8">
  <meta name="description" content="A lightweight browser-based Lottie JSON editor with layers, keyframes, easing, and a live preview.">
  <title>Lottie Bench — Motion Editor</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <style>:root{color-scheme:light;box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;background:#fff;color:#202127}[hidden]:not([hidden=until-found i]){display:none!important}</style>
 <style>
:root{
  --bg:#f6f6f8;--panel:#fff;--panel2:#f5f5f7;--line:#e7e8ec;--fg:#24252b;--muted:#858895;
  --accent:#7067f7;--accent-fg:#fff;--danger:#d84d56;--key:#edae45;--input:#fff;
  --bar:#d8d9de;--barsel:#8882ff;--stagebg:#f5f5f7;--ck1:#fff;--ck2:#f0f0f2;--ph:#292833;
  --ui:'Inter',system-ui,-apple-system,sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;width:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--fg);font:13px/1.4 var(--ui);padding:0}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;gap:0;width:100%;height:100dvh;min-height:540px;grid-template-columns:52px 274px minmax(320px,1fr) 272px;grid-template-rows:minmax(320px,1fr) 224px;grid-template-areas:"rail layers stage right" "timeline timeline timeline timeline";background:var(--panel)}
.rail{grid-area:rail;display:flex;flex-direction:column;align-items:center;gap:9px;padding:10px 0;background:#fff;border-right:1px solid var(--line);z-index:6}
.rail-logo{display:grid;place-items:center;width:32px;height:34px;margin-bottom:12px;color:#24242a;font:italic 700 30px/1 Georgia,serif;user-select:none}
.rail-rule{height:1px;width:26px;background:var(--line);margin:0 0 4px}
.rail-btn{width:36px;height:36px;display:grid;place-items:center;border:0;border-radius:8px;background:transparent;color:#626574;padding:0}
.rail-btn:hover{background:#f2f2f5;color:#292a32}
.rail-btn.on{background:#efeeff;color:var(--accent)}
.rail-btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.panel,.stagewrap,.timeline{background:var(--panel);border:0;border-radius:0;min-width:0;min-height:0;overflow:hidden}
.layers{grid-area:layers;display:flex;flex-direction:column;border-right:1px solid var(--line)}
.stagewrap{grid-area:stage;display:flex;flex-direction:column;background:#f7f7f8;min-width:0}
.right{grid-area:right;display:flex;flex-direction:column;border-left:1px solid var(--line);background:#fff}
.workspace-head{height:54px;min-height:54px;padding:0 20px 0 24px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #ececef;background:#fff}
.workspace-title{display:flex;align-items:center;gap:9px;min-width:0;font-size:13px;font-weight:600;color:#4c4d57}
.workspace-title .board-mark{width:16px;height:16px;border:1.5px solid #9b9ca5;border-radius:3px;display:inline-block;position:relative;flex:none}
.workspace-title .board-mark:after{content:'';position:absolute;inset:3px;border:1px solid #b7b8bf;border-radius:1px}
.doc-meta{font:11px var(--mono);color:#9a9ba5;font-weight:400;white-space:nowrap}
.workspace-actions{display:flex;align-items:center;gap:7px;margin-left:auto;flex-wrap:nowrap}
.workspace-actions select{max-width:142px}
.phead{display:flex;align-items:center;gap:6px;padding:9px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap;min-height:46px;background:#fff}
.phead .ttl{font-weight:600;margin-right:auto;font-size:13px;color:#353640}
.btn{background:#fff;border:1px solid #e1e2e7;border-radius:7px;padding:6px 10px;line-height:1.2;white-space:nowrap;transition:background .15s,border-color .15s,color .15s}
.btn:hover{border-color:#bfc0ca;background:#fafafd}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.btn.primary:hover{background:#6258e8;border-color:#6258e8}
.btn.on{border-color:var(--accent);color:var(--accent);background:#f4f3ff}
.btn:disabled{opacity:.38;cursor:default}
.ib{background:transparent;border:0;border-radius:6px;width:28px;height:28px;display:inline-grid;place-items:center;color:#777987;padding:0;flex:none}
.ib:hover{background:#f1f1f5;color:var(--fg)}
.ib.on{color:var(--accent);background:#f1f0ff}
.ib.sm{width:20px;height:20px}
.ib svg,.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib.sm svg{width:13px;height:13px}
select,input[type=text],input[type=number],textarea{background:var(--input);border:1px solid #e1e2e7;border-radius:6px;padding:5px 7px;min-width:0}
select{padding:5px 7px}
input[type=number]{width:100%;font-family:var(--mono);font-size:12px;-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=color]{width:44px;height:26px;padding:2px;border:1px solid #e1e2e7;border-radius:6px;background:var(--input)}
input[type=checkbox]{accent-color:var(--accent);vertical-align:middle}
.list{overflow:auto;flex:1;min-height:0;padding:6px 7px}
.lrow{display:flex;align-items:center;gap:2px;padding:4px 5px;border-radius:7px;border:1px solid transparent;cursor:pointer;min-height:31px}
.lrow:hover{background:#f6f6f8}
.lrow.sel{background:#f0efff;border-color:#dad8ff;color:#3b36a5}
.lrow .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:2px 4px}
.badge{width:20px;height:20px;border-radius:5px;background:#f5f5f7;border:1px solid #ebebef;display:grid;place-items:center;font:600 10px var(--mono);color:#7d7f8a;flex:none}
.crumb{padding:6px 10px;color:var(--muted);font-size:12px;border-bottom:1px solid var(--line);display:flex;gap:6px;align-items:center}
.empty{padding:18px;color:var(--muted);text-align:center;line-height:1.6}
.toolbar,.transport{display:flex;align-items:center;gap:7px;padding:6px 12px;flex-wrap:wrap}
.toolbar{height:42px;min-height:42px;border-bottom:1px solid #ededf0;background:#f7f7f8}
.transport{height:58px;min-height:58px;border-bottom:1px solid var(--line);background:#fff;padding:7px 14px;gap:8px}
.sp{flex:1}
.stagearea{flex:1;min-height:160px;overflow:auto;background:#f7f7f8;display:grid;place-items:center;padding:20px}
.canvas{position:relative;flex:none;margin:auto;box-shadow:0 3px 12px rgba(20,20,25,.10),0 0 0 1px #e3e3e7;background-image:conic-gradient(var(--ck1) 25%,var(--ck2) 0 50%,var(--ck1) 0 75%,var(--ck2) 0);background-size:16px 16px;touch-action:none}
.canvas.solid{background-image:none}
.lot{position:absolute;inset:0}
.lot svg{display:block;width:100%;height:100%}
.sel{position:absolute;border:1.5px solid var(--accent);pointer-events:none;display:none}
.penlayer{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.timefld{font:11px var(--mono);color:#737582;min-width:17ch}
.frame{width:68px}
#tFrame{width:60px;text-align:center}
#tSpeed{width:76px}
#tlZoom{accent-color:var(--accent)}
.note{color:var(--muted);font-size:11px;margin:6px 0}
.tabs{display:flex;border-bottom:1px solid var(--line);background:#fff;min-height:43px}
.tab{flex:1;background:transparent;border:0;border-bottom:2px solid transparent;padding:10px 6px;color:#858795;font-weight:500}
.tab.on{color:#30313a;border-bottom-color:var(--accent)}
.pane{overflow:auto;flex:1;min-height:0;padding:8px 12px 16px;background:#fff}
.pane[hidden]{display:none!important}
.ph{display:flex;align-items:center;gap:4px;margin:11px 0 4px;padding:4px 0;border-bottom:1px solid #ededf0;font-weight:600;font-size:12px;color:#4a4b55}
.ph .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ph.d1{margin-left:8px}.ph.d2{margin-left:16px}.ph.d3{margin-left:24px}.ph.d4{margin-left:32px}
.ph select.mini{max-width:102px;font-size:11px;padding:3px}
.prow,.frow{display:grid;grid-template-columns:24px 74px minmax(0,1fr) 24px;align-items:center;gap:4px;padding:3px 0}
.frow{grid-template-columns:74px minmax(0,1fr)}
.prow label,.frow label{color:#818390;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow label.scrub{cursor:ew-resize}
.vals{display:flex;gap:4px;align-items:center;min-width:0}
.vals input{min-width:0}
.stw.on{color:var(--key)}
.dia{transition:none}.dia.dim{opacity:.35}.dia.on{color:var(--key)}
.ease{background:#fafafd;border:1px solid #e6e6ec;border-radius:8px;padding:8px;margin:6px 0 10px}
.ease .row{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}
.ease .row .btn{padding:4px 7px;font-size:10px}
.curve{width:160px;max-width:100%}
.curve svg{width:100%;height:auto;display:block;overflow:visible;touch-action:none}
.cbox{fill:var(--input);stroke:var(--line)}
.cdiag{stroke:var(--line);stroke-dasharray:3 3;fill:none}
.cc{stroke:var(--accent);stroke-width:2.5}
.h1,.h2{stroke:var(--muted);stroke-width:1.2}
.p1,.p2{fill:var(--key);stroke:var(--bg);stroke-width:2;cursor:grab}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin-top:6px}
textarea.code{width:100%;height:calc(100% - 78px);min-height:180px;font:11px/1.5 var(--mono);resize:none;white-space:pre;overflow:auto;background:#fafafd}
.codebar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:7px;align-items:center}
.stat{font:10px var(--mono);color:var(--muted);margin-top:6px}
.stat.err{color:var(--danger)}
.timeline{grid-area:timeline;display:flex;flex-direction:column;border-top:1px solid #e2e3e8;background:#fff;z-index:5}
.tl-scroll{flex:1;overflow:auto;position:relative;min-height:0;background:#fff}
#tlinner{position:relative;min-height:100%}
.tr{display:flex;height:27px;border-bottom:1px solid #f0f0f3}
.tr .lab{position:sticky;left:0;z-index:3;width:326px;flex:none;background:#fff;border-right:1px solid #ececf0;display:flex;align-items:center;gap:4px;padding:0 9px;overflow:hidden;white-space:nowrap;cursor:pointer}
.tr .lab .nm{overflow:hidden;text-overflow:ellipsis}
.tr .lab.sel{background:#f3f2ff}
.tr.headrow .lab{color:#9294a0;font-size:10px;font-weight:600}
.tr.prop .lab{color:#777987;cursor:default}
.tr .track{position:relative;flex:none}
.tr.ruler{position:sticky;top:0;z-index:4;background:#fafafd;height:25px}
.tr.ruler .lab{background:#fafafd;cursor:default;color:#868895;font-size:10px}
.tick{position:absolute;top:0;bottom:0;border-left:1px solid #e5e5eb}
.tick span{position:absolute;top:5px;left:4px;font:10px var(--mono);color:#9294a0}
.bar{position:absolute;top:5px;bottom:5px;background:var(--bar);border-radius:5px;cursor:grab}
.bar.sel{background:var(--barsel);opacity:.9}
.bar .hd{position:absolute;top:0;bottom:0;width:8px;cursor:ew-resize}
.bar .hd.l{left:0}.bar .hd.r{right:0}
.kf{position:absolute;top:50%;width:9px;height:9px;margin:-5px 0 0 -5px;transform:rotate(45deg);background:var(--key);border:1px solid #fff;cursor:grab}
.kf.sel{outline:2px solid #39364b;outline-offset:1px}
.tr.prop .track.static{background:repeating-linear-gradient(90deg,transparent 0 7px,#f0f0f3 7px 8px)}
#ph{position:absolute;top:0;bottom:0;width:0;border-left:2px solid var(--ph);z-index:5;pointer-events:none}
#ph::before{content:'';position:absolute;top:0;left:-7px;border:6px solid transparent;border-top-color:var(--ph);border-bottom:0}
.inspector-head{display:flex;align-items:center;justify-content:space-between;gap:8px;height:54px;min-height:54px;padding:0 13px;border-bottom:1px solid var(--line);background:#fff}
.inspector-title{font-weight:600;color:#343540}
.inspector-actions{display:flex;gap:6px;align-items:center}
.toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:#292a32;color:#fff;padding:9px 14px;border-radius:8px;z-index:50;max-width:90vw;display:none;font-weight:500;box-shadow:0 6px 22px rgba(0,0,0,.15)}
.toast.err{background:var(--danger);color:#fff}
.drop{outline:2px dashed var(--accent);outline-offset:-6px}
@media(max-width:1100px){
 .app{grid-template-columns:48px 230px minmax(260px,1fr) 250px;grid-template-rows:minmax(300px,1fr) 210px}
 .tr .lab{width:278px}
}
@media(max-width:820px){
 html,body{height:auto;min-height:100%;overflow:auto}
 .app{display:flex;flex-direction:column;height:auto;min-height:100vh}
 .rail{height:48px;min-height:48px;flex-direction:row;justify-content:flex-start;padding:0 10px;border-right:0;border-bottom:1px solid var(--line)}
 .rail-logo{margin:0 8px 0 0;width:28px;height:28px;font-size:26px}
 .rail-rule{height:24px;width:1px;margin:0 3px}
 .layers{max-height:220px;min-height:100px;border-right:0;border-bottom:1px solid var(--line)}
 .stagewrap{min-height:510px;height:65vh}
 .right{max-height:560px;min-height:360px;border-left:0;border-top:1px solid var(--line)}
 .timeline{height:260px;min-height:260px;flex:none}
 .workspace-head{padding:0 12px}
 .workspace-actions{gap:4px}
 .workspace-actions select{max-width:112px}
 .stagearea{padding:12px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


<div class="app" id="app">
  <aside class="rail" aria-label="Tools">
    <div class="rail-logo" aria-label="Lottie Bench">ℓ</div>
    <div class="rail-rule"></div>
    <button class="rail-btn on" id="toolSel" type="button" title="Select and move" aria-label="Select and move"></button>
    <button class="rail-btn" id="toolPen" type="button" title="Draw a vector path" aria-label="Draw a vector path"></button>
    <button class="rail-btn" id="layersFocus" type="button" title="Focus layers" aria-label="Focus layers">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 12 9 5 9-5M3 16l9 5 9-5"/></svg>
    </button>
  </aside>

  <section class="panel layers">
    <div class="phead">
      <span class="ttl">Layers</span>
      <select id="addSel" title="Add a layer"><option value="">+ Add</option><option value="rect">Rectangle</option><option value="ellipse">Ellipse</option><option value="star">Star</option><option value="polygon">Polygon</option><option value="solid">Solid</option><option value="null">Null</option></select>
    </div>
    <div class="phead" id="layerTools"></div>
    <div class="crumb" id="crumb" hidden></div>
    <div class="list" id="layerlist" tabindex="0" aria-label="Animation layers"></div>
  </section>

  <section class="stagewrap">
    <div class="workspace-head">
      <div class="workspace-title"><span class="board-mark"></span><span id="docTitle">Artboard 1</span><span class="doc-meta" id="docMeta"></span></div>
      <div class="workspace-actions">
        <select id="tplsel" title="Start a new animation"><option value="">New…</option><option value="blank">Blank</option><option value="pulse">Pulse</option><option value="spinner">Loader ring</option><option value="bounce">Bouncing ball</option></select>
        <button class="btn" id="btnImport" type="button">Import JSON</button>
        <button class="ib" id="btnUndo" type="button" title="Undo (Ctrl+Z)" aria-label="Undo"></button>
        <button class="ib" id="btnRedo" type="button" title="Redo (Ctrl+Shift+Z)" aria-label="Redo"></button>
        <input type="file" id="file" accept=".json,application/json" hidden>
      </div>
    </div>
    <div class="toolbar">
      <span class="note" style="margin:0">Preview</span>
      <span class="sp"></span>
      <button class="ib" id="zOut" type="button" title="Zoom out" aria-label="Zoom out"></button>
      <button class="btn" id="zFit" type="button">Fit</button>
      <button class="ib" id="zIn" type="button" title="Zoom in" aria-label="Zoom in"></button>
      <label class="note" style="margin:0 0 0 8px"><input type="checkbox" id="transp"> Transparent</label>
    </div>
    <div class="stagearea" id="stagearea">
      <div class="canvas" id="canvas">
        <svg class="penlayer" id="penlayer"></svg>
        <div class="sel" id="selbox"></div>
      </div>
    </div>
  </section>

  <section class="panel right">
    <div class="inspector-head">
      <span class="inspector-title">Inspector</span>
      <div class="inspector-actions">
        <button class="btn" id="btnCopy" type="button" title="Copy the animation JSON so you can share it">Share</button>
        <button class="btn primary" id="btnExport" type="button">Export</button>
      </div>
    </div>
    <div class="tabs">
      <button class="tab on" data-tab="props" type="button">Properties</button>
      <button class="tab" data-tab="comp" type="button">Composition</button>
      <button class="tab" data-tab="code" type="button">JSON</button>
    </div>
    <div class="pane" id="paneProps"></div>
    <div class="pane" id="paneComp" hidden></div>
    <div class="pane" id="paneCode" hidden>
      <div class="codebar">
        <button class="btn primary" id="codeApply" type="button">Apply JSON</button>
        <button class="btn" id="codeCopy" type="button">Copy</button>
        <button class="btn" id="codeDl" type="button">Download .json</button>
        <button class="btn" id="codeSvg" type="button">Frame as .svg</button>
        <label class="note" style="margin:0"><input type="checkbox" id="codeMin"> Minify</label>
      </div>
      <textarea class="code" id="codeText" spellcheck="false" aria-label="Animation JSON"></textarea>
      <div class="stat" id="codeStat"></div>
    </div>
  </section>

  <section class="timeline">
    <div class="transport">
      <button class="ib" id="tFirst" type="button" title="Go to start" aria-label="Go to start"></button>
      <button class="btn" id="tPlay" type="button" title="Play / pause (Space)"></button>
      <button class="ib" id="tLast" type="button" title="Go to end" aria-label="Go to end"></button>
      <button class="ib" id="tLoop" type="button" title="Loop" aria-label="Loop"></button>
      <input type="number" class="frame" id="tFrame" title="Current frame" step="1">
      <span class="timefld" id="timefld"></span>
      <span class="sp"></span>
      <select id="tSpeed" title="Preview speed"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select>
      <label class="note" style="margin:0">Timeline zoom <input type="range" id="tlZoom" min="1" max="12" step="0.5" value="1" style="width:90px;vertical-align:middle"></label>
    </div>
    <div class="tl-scroll" id="tlscroll"><div id="tlinner"></div></div>
  </section>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/lottie-web@5.13.0/build/player/lottie.min.js"></script>
<script>
'use strict';
//#PURE-START
const S=k=>({a:0,k});
const clone=o=>JSON.parse(JSON.stringify(o));
const asArr=v=>Array.isArray(v)?v.slice():[v];
const fmt=v=>Math.round(v*1000)/1000;
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
function bez(x1,y1,x2,y2){
  return t=>{
    if(t<=0) return 0; if(t>=1) return 1;
    let lo=0,hi=1,u=t;
    for(let i=0;i<30;i++){
      const x=3*(1-u)*(1-u)*u*x1+3*(1-u)*u*u*x2+u*u*u;
      if(Math.abs(x-t)<1e-6) break;
      if(x<t) lo=u; else hi=u;
      u=(lo+hi)/2;
    }
    return 3*(1-u)*(1-u)*u*y1+3*(1-u)*u*u*y2+u*u*u;
  };
}
function lerp(a,b,u){
  if(Array.isArray(a)) return a.map((v,i)=>typeof v==='number'?v+((typeof b[i]==='number'?b[i]:v)-v)*u:v);
  return a+(b-a)*u;
}
const g0=a=>Array.isArray(a)?a[0]:a;
function easeFn(kf){
  const o=kf.o||{x:[0],y:[0]},i=kf.i||{x:[1],y:[1]};
  return bez(g0(o.x),g0(o.y),g0(i.x),g0(i.y));
}
function getValue(p,t){
  if(!p) return 0;
  if(!p.a) return p.k;
  const k=p.k; if(!k.length) return 0;
  if(t<=k[0].t) return k[0].s;
  for(let n=0;n<k.length-1;n++){
    const a=k[n],b=k[n+1];
    if(t<b.t){
      if(a.h) return a.s;
      return lerp(a.s,b.s,easeFn(a)((t-a.t)/(b.t-a.t)));
    }
  }
  return k[k.length-1].s;
}
function readRow(r,t){
  const v=getValue(r.prop,t-r.off);
  if(r.kind==='num') return Array.isArray(v)?v[0]:v;

  const el=anim.renderer.elements&&anim.renderer.elements[idx]; const g=el&&(el.layerElement||el.baseElement); if(!g||!g.getBoundingClientRect) return;
  const r=g.getBoundingClientRect(),cr=$('#canvas').getBoundingClientRect();
  if(r.width<1||r.height<1) return;
  Object.assign(box.style,{display:'block',left:(r.left-cr.left)+'px',top:(r.top-cr.top)+'px',width:r.width+'px',height:r.height+'px'});
}
function hitLayer(target){
  const els=anim&&anim.renderer&&anim.renderer.elements; if(!els||st.ctx) return null;
  for(let i=0;i<els.length;i++){
    const el=els[i],g=el&&(el.layerElement||el.baseElement),L=st.comp.layers[i];
    if(g&&g.contains&&g.contains(target)&&L&&!st.locked[L.ind]) return L;
  }
  return null;
}
function posRows(L){ return buildRows(L,curLayers()).filter(r=>r.type==='prop'&&(r.key==='ks.p'||r.key==='ks.p.x'||r.key==='ks.p.y')); }
$('#canvas').addEventListener('pointerdown',e=>{
  const cv=$('#canvas'),r=cv.getBoundingClientRect();
  if(st.tool==='pen'){ e.preventDefault(); penClick((e.clientX-r.left)/st.scale,(e.clientY-r.top)/st.scale,e); return; }
  const L=hitLayer(e.target);
  if(!L){ if(e.target===cv||e.target.closest('.lot')){ st.sel=null; st.kf=null; queue('layers','panel','tl'); positionOverlay(); } return; }
  e.preventDefault();
  if(st.sel!==L.ind) selectLayer(L.ind);
  const pr=posRows(L); if(!pr.length) return;
  const x0=e.clientX,y0=e.clientY,start=pr.map(q=>readRow(q,st.t)); const key='mv'+L.ind; beginGesture(key); let moved=false;
  drag(e,ev=>{
    const dx=(ev.clientX-x0)/st.scale,dy=(ev.clientY-y0)/st.scale; if(!moved&&Math.abs(dx)+Math.abs(dy)<0.5) return; moved=true;
    mutate(()=>{
      pr.forEach((q,i)=>{
        if(q.kind==='vec'){ const v=start[i].slice(); v[0]+=dx; v[1]+=dy; writeRow(q,st.t,v); }
        else writeRow(q,st.t,start[i]+(q.key==='ks.p.x'?dx:dy));
      });
    },key);
  },endGesture);
});
/* pen tool */
function penDraw(){
  const sv=$('#penlayer'); sv.setAttribute('viewBox','0 0 '+st.comp.w+' '+st.comp.h); sv.textContent='';
  const p=st.pen; if(!p.length) return;
  const sw=2/st.scale;
  const pl=document.createElementNS(NS,'polyline'); pl.setAttribute('points',p.map(q=>q.join(',')).join(' ')); pl.setAttribute('fill','none'); pl.setAttribute('stroke','var(--accent)'); pl.setAttribute('stroke-width',sw); sv.append(pl);
  p.forEach((q,i)=>{ const c=document.createElementNS(NS,'circle'); c.setAttribute('cx',q[0]); c.setAttribute('cy',q[1]); c.setAttribute('r',(i===0?6:4)/st.scale); c.setAttribute('fill',i===0?'var(--key)':'var(--accent)'); sv.append(c); });
}
function penClick(x,y,e){
  const p=st.pen;
  if(p.length>=3&&Math.hypot(p[0][0]-x,p[0][1]-y)*st.scale<10){ penFinish(true); return; }
  if(e.detail>=2&&p.length>=2){ penFinish(false); return; }
  p.push([Math.round(x*10)/10,Math.round(y*10)/10]); penDraw();
}
function penFinish(closed){
  const p=st.pen; if(p.length<2){ st.pen=[]; penDraw(); return; }
  const cx=p.reduce((a,q)=>a+q[0],0)/p.length,cy=p.reduce((a,q)=>a+q[1],0)/p.length;
  structural(()=>{
    const ls=curLayers(),c=st.comp,col=PALETTE[ls.length%PALETTE.length];
    const L=addLayer(c,ls,'null'); L.ty=4; L.nm='Path'; L.ks.p=S([Math.round(cx*10)/10,Math.round(cy*10)/10,0]);
    const z=p.map(()=>[0,0]);
    L.shapes=[{ty:'gr',nm:'Path group',it:[{ty:'sh',d:1,nm:'Path',ks:{a:0,k:{c:closed,v:p.map(q=>[Math.round((q[0]-cx)*10)/10,Math.round((q[1]-cy)*10)/10]),i:z,o:z.map(a=>a.slice())}}},closed?fillItem(col):strokeItem(col,10),grTr()],np:3,cix:2,bm:0,ix:1}];
    st.sel=L.ind; st.expanded[L.ind]=true;
  });
  st.pen=[]; penDraw(); setTool('select');
}
function setTool(t){
  st.tool=t; $('#toolSel').classList.toggle('on',t==='select'); $('#toolPen').classList.toggle('on',t==='pen');
  $('#canvas').style.cursor=t==='pen'?'crosshair':'default'; if(t!=='pen'){ st.pen=[]; penDraw(); } positionOverlay();
}

/* ---------- transport ---------- */
let raf=0,lastNow=0;
function play(){
  if(st.playing) return; const c=st.comp;
  if(st.t>=c.op-1) st.t=c.ip;
  st.playing=true; lastNow=performance.now(); raf=requestAnimationFrame(tick); updTransport();
}
function pause(){ if(!st.playing) return; st.playing=false; cancelAnimationFrame(raf); st.t=Math.round(st.t); setT(st.t); updTransport(); }
function tick(now){
  if(!st.playing) return;
  const c=st.comp,dt=(now-lastNow)/1000; lastNow=now;
  let t=st.t+dt*c.fr*st.speed;
  if(t>=c.op){ if(st.loop) t=c.ip+((t-c.op)%Math.max(1,c.op-c.ip)); else { st.playing=false; setT(c.op-1); updTransport(); return; } }
  setT(t); raf=requestAnimationFrame(tick);
}
function updTransport(){
  const c=st.comp; if(!c) return;
  const title=$('#docTitle'),meta=$('#docMeta');
  if(title) title.textContent=c.nm||'Untitled animation';
  if(meta) meta.textContent=c.w+' × '+c.h;
  $('#tPlay').textContent=''; $('#tPlay').append(icon(st.playing?'pause':'play'),document.createTextNode(st.playing?' Pause':' Play'));
  $('#tLoop').classList.toggle('on',st.loop);
  const fr=$('#tFrame'); if(document.activeElement!==fr) fr.value=String(Math.round(st.t));
  $('#timefld').textContent=(st.t/c.fr).toFixed(2)+'s / '+(c.op/c.fr).toFixed(2)+'s · '+c.op+'f';
  $('#btnUndo').disabled=!undoS.length; $('#btnRedo').disabled=!redoS.length;
}

/* ---------- timeline ---------- */
function xToT(clientX){ const r=$('#tlinner').getBoundingClientRect(); return st.comp.ip+(clientX-r.left-LW)/st.ppf; }
function updatePlayhead(){ const p=$('#ph'); if(p) p.style.left=(LW+(st.t-st.comp.ip)*st.ppf)+'px'; }
function scrub(e){
  if(e.clientX-$('#tlinner').getBoundingClientRect().left<LW) return;
  if(st.playing) pause();
  setT(Math.round(xToT(e.clientX)));
  drag(e,ev=>setT(Math.round(xToT(ev.clientX))));
}
function renderTimeline(){
  const sc=$('#tlscroll'),inner=$('#tlinner'),c=st.comp,sl=sc.scrollLeft,stp=sc.scrollTop;
  inner.textContent='';  const dur=Math.max(1,c.op-c.ip),avail=Math.max(200,sc.clientWidth-LW-30);
  const ppf=(avail/dur)*st.tlzoom; st.ppf=ppf; const W=dur*ppf;
  inner.style.width=(LW+W+30)+'px';
  const ruler=h('div',{class:'tr ruler'},h('div',{class:'lab'},'Frames'),h('div',{class:'track',style:'width:'+W+'px'}));
  const step=[1,2,5,10,15,30,60,120,300,600].find(s=>s*ppf>=46)||1200;
  for(let f=Math.ceil(c.ip/step)*step;f<=c.op;f+=step) ruler.lastChild.append(h('div',{class:'tick',style:'left:'+(f-c.ip)*ppf+'px'},h('span',{},String(f))));
  ruler.addEventListener('pointerdown',scrub);
  inner.append(ruler);
  curLayers().forEach(L=>{
    const open=!!st.expanded[L.ind],isSel=st.sel===L.ind;
    const lab=h('div',{class:'lab'+(isSel?' sel':''),onclick:()=>{ if(st.sel!==L.ind) selectLayer(L.ind); }},
      h('button',{class:'ib sm',onclick:e=>{ e.stopPropagation(); st.expanded[L.ind]=!open; renderTimeline(); }},icon(open?'chevD':'chevR')),
      h('span',{class:'badge'},TYPEBADGE[L.ty]||'?'),h('span',{class:'nm'},L.nm||('Layer '+L.ind)));
    const track=h('div',{class:'track',style:'width:'+W+'px'});
    const bar=h('div',{class:'bar'+(isSel?' sel':''),style:'left:'+(L.ip-c.ip)*ppf+'px;width:'+Math.max(6,(L.op-L.ip)*ppf)+'px',title:'Drag to move in time; drag the ends to trim'},h('div',{class:'hd l'}),h('div',{class:'hd r'}));
    bar.addEventListener('pointerdown',e=>{
      e.stopPropagation(); e.preventDefault(); if(st.sel!==L.ind) selectLayer(L.ind);
      const mode=e.target.classList.contains('l')?'in':e.target.classList.contains('r')?'out':'move';
      const x0=e.clientX,ip0=L.ip,op0=L.op,s0=L.st||0,key='bar'+L.ind+mode; beginGesture(key);
      drag(e,ev=>{ const d=Math.round((ev.clientX-x0)/st.ppf); mutate(()=>{
        if(mode==='move'){ L.ip=ip0+d; L.op=op0+d; L.st=s0+d; } else if(mode==='in') L.ip=Math.min(ip0+d,L.op-1); else L.op=Math.max(op0+d,L.ip+1);
      },key); },endGesture);
    });
    track.append(bar);
    inner.append(h('div',{class:'tr'},lab,track));
    if(!open) return;
    buildRows(L,curLayers()).forEach(r=>{
      if(r.type==='head'&&!r.pono&&r.item&&r.item.ty==='tr') return;
      if(r.type==='head'&&!r.pono) { inner.append(h('div',{class:'tr headrow'},h('div',{class:'lab',style:'padding-left:'+(22+(r.depth||0)*10)+'px'},r.label),h('div',{class:'track',style:'width:'+W+'px'}))); return; }
      if(r.type!=='prop') return;
      const lb=h('div',{class:'lab',style:'padding-left:'+(30+(r.depth||0)*8)+'px',title:r.label},h('span',{class:'nm'},r.label));
      const tk=h('div',{class:'track'+(r.prop.a?'':' static'),style:'width:'+W+'px'});
      if(r.prop.a) r.prop.k.forEach(kf=>{
        const sel=st.kf&&st.kf.kf===kf;
        const d=h('div',{class:'kf'+(sel?' sel':''),style:'left:'+(kf.t+r.off-c.ip)*ppf+'px',title:'Frame '+fmt(kf.t+r.off)});
        d.addEventListener('pointerdown',e=>{
          e.stopPropagation(); e.preventDefault();
          if(st.sel!==L.ind) st.sel=L.ind;
          st.kf={ind:L.ind,key:r.key,kf}; queue('layers','panel','tl'); setT(Math.round(kf.t+r.off));
          const x0=e.clientX,t0=kf.t,key='kd'+L.ind+r.key; beginGesture(key); let moved=false;
          drag(e,ev=>{ const dd=Math.round((ev.clientX-x0)/st.ppf); if(!moved&&!dd) return; moved=true; mutate(()=>{ kf.t=t0+dd; r.prop.k.sort((a,b)=>a.t-b.t); },key); setT(Math.round(kf.t+r.off)); },()=>{ endGesture(); queue('panel'); });
        });
        tk.append(d);
      });
      tk.addEventListener('dblclick',e=>{ const t=Math.round(xToT(e.clientX)); setT(t); mutate(()=>{ if(!r.prop.a) toggleAnim(r,t); else if(!r.prop.k.some(k=>Math.abs(k.t+r.off-t)<0.5)) addKey(r.prop,Math.round(t-r.off),r.kind==='num'?readRow(r,t):readRow(r,t).slice()); },null,{panel:true}); });
      tk.addEventListener('pointerdown',scrub);
      inner.append(h('div',{class:'tr prop'},lb,tk));
    });
  });
  inner.append(h('div',{id:'ph'}));
  sc.scrollLeft=sl; sc.scrollTop=stp; updatePlayhead();
}

/* ---------- JSON pane + export ---------- */
function jsonText(){ return JSON.stringify(exportData(),null,st.minify?0:2); }
function renderJson(){
  if($('#paneCode').hidden) return;
  const ta=$('#codeText'); if(document.activeElement===ta) return;
  const t=jsonText(); ta.value=t; setStat(Math.round(t.length/102.4)/10+' KB · '+st.comp.layers.length+' layers · valid',false);
}
function setStat(m,err){ const s=$('#codeStat'); s.textContent=m; s.className='stat'+(err?' err':''); }
function applyJson(text){
  try{ const o=JSON.parse(text); loadComp(o); setStat('Applied.',false); toast('JSON applied'); }
  catch(e){ setStat('Cannot apply: '+e.message,true); toast('Cannot apply: '+e.message,true); }
}
async function saveFile(name,data){
  try{
    const type=name.toLowerCase().endsWith('.svg')?'image/svg+xml;charset=utf-8':'application/json;charset=utf-8';
    const blob=new Blob([data],{type});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download=name; a.style.display='none';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500);
    toast('Saved '+name);
  }catch(e){ toast('Could not save: '+(e&&e.message||'download failed'),true); }
}
async function copyJson(){
  const t=jsonText();
  try{ await navigator.clipboard.writeText(t); toast('JSON copied'); }
  catch(e){ showCode(); const ta=$('#codeText'); ta.value=t; ta.focus(); ta.select(); toast('Select all and copy (Ctrl+C)'); }
}
const fname=ext=>(st.comp.nm||'animation').replace(/[^\w\-]+/g,'-').toLowerCase()+ext;
function showCode(){ setTab('code'); }
function frameSvg(){
  const svg=curHolder&&curHolder.querySelector('svg'); if(!svg) return null;
  const c=svg.cloneNode(true); c.setAttribute('xmlns',NS); c.setAttribute('width',st.comp.w); c.setAttribute('height',st.comp.h);
  return new XMLSerializer().serializeToString(c);
}
function readFile(f){
  const r=new FileReader(); r.onload=()=>{ try{ loadComp(JSON.parse(r.result)); toast('Imported '+f.name); }catch(e){ toast('Cannot import: '+e.message,true); } };
  r.onerror=()=>toast('Could not read the file',true); r.readAsText(f);
}
function setTab(t){
  st.tab=t; document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
  $('#paneProps').hidden=t!=='props'; $('#paneComp').hidden=t!=='comp'; $('#paneCode').hidden=t!=='code';
  if(t==='code') renderJson(); if(t==='comp') renderCompPane();
}

/* ---------- wiring ---------- */
function setupIcons(){
  $('#btnUndo').append(icon('undo')); $('#btnRedo').append(icon('redo'));
  $('#toolSel').append(icon('cursor')); $('#toolPen').append(icon('pen'));
  $('#zOut').append(icon('minus')); $('#zIn').append(icon('plus'));
  $('#tFirst').append(icon('first')); $('#tLast').append(icon('last')); $('#tLoop').append(icon('loop'));
}
function wire(){
  $('#btnUndo').onclick=undo; $('#btnRedo').onclick=redo;
  $('#layersFocus').onclick=()=>$('#layerlist').focus();
  $('#btnImport').onclick=()=>$('#file').click();
  $('#file').onchange=e=>{ const f=e.target.files[0]; if(f) readFile(f); e.target.value=''; };
  $('#btnExport').onclick=()=>saveFile(fname('.json'),jsonText());
  $('#btnCopy').onclick=copyJson; $('#codeCopy').onclick=copyJson;
  $('#codeDl').onclick=()=>saveFile(fname('.json'),jsonText());
  $('#codeSvg').onclick=()=>{ const s=frameSvg(); if(!s) return toast('Nothing rendered yet',true); saveFile(fname('-frame-'+Math.round(st.t)+'.svg'),s); };
  $('#codeApply').onclick=()=>applyJson($('#codeText').value);
  $('#codeMin').onchange=e=>{ st.minify=e.target.checked; $('#codeText').blur(); renderJson(); };
  $('#codeText').addEventListener('input',()=>{ try{ JSON.parse($('#codeText').value); setStat('Valid JSON. Press Apply to load it.',false); }catch(e){ setStat(e.message,true); } });
  $('#tplsel').onchange=e=>{ const v=e.target.value; e.target.value=''; if(v) loadComp(TEMPLATES[v]()); };
  $('#addSel').onchange=e=>{ const v=e.target.value; e.target.value=''; if(!v) return; structural(()=>{ const ls=curLayers(),L=addLayer(st.comp,ls,v); st.sel=L.ind; st.expanded[L.ind]=true; }); };
  document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
  $('#toolSel').onclick=()=>setTool('select'); $('#toolPen').onclick=()=>setTool('pen');
  $('#zIn').onclick=()=>{ st.zoom=Math.min(8,st.zoom*1.25); layoutStage(); };
  $('#zOut').onclick=()=>{ st.zoom=Math.max(0.2,st.zoom/1.25); layoutStage(); };
  $('#zFit').onclick=()=>{ st.zoom=1; layoutStage(); };
  $('#transp').onchange=e=>{ st.transp=e.target.checked; layoutStage(); };
  $('#tPlay').onclick=()=>st.playing?pause():play();
  $('#tFirst').onclick=()=>{ pause(); setT(st.comp.ip); };
  $('#tLast').onclick=()=>{ pause(); setT(st.comp.op-1); };
  $('#tLoop').onclick=()=>{ st.loop=!st.loop; updTransport(); };
  $('#tFrame').oninput=e=>{ const v=e.target.valueAsNumber; if(!isNaN(v)){ if(st.playing) pause(); setT(Math.round(v)); } };
  $('#tSpeed').onchange=e=>{ st.speed=+e.target.value; };
  $('#tlZoom').oninput=e=>{ st.tlzoom=+e.target.value; renderTimeline(); };
  new ResizeObserver(()=>queue('layout','tl')).observe($('#stagearea'));
  addEventListener('keydown',e=>{
    const tg=e.target&&e.target.tagName; const typing=tg==='INPUT'||tg==='TEXTAREA'||tg==='SELECT';
    const mod=e.ctrlKey||e.metaKey;
    if(mod&&e.key.toLowerCase()==='z'&&!typing){ e.preventDefault(); e.shiftKey?redo():undo(); return; }
    if(mod&&e.key.toLowerCase()==='y'&&!typing){ e.preventDefault(); redo(); return; }
    if(typing) return;
    if(e.key===' '){ e.preventDefault(); st.playing?pause():play(); }
    else if(e.key==='ArrowLeft'){ e.preventDefault(); pause(); setT(Math.round(st.t)-(e.shiftKey?10:1)); }
    else if(e.key==='ArrowRight'){ e.preventDefault(); pause(); setT(Math.round(st.t)+(e.shiftKey?10:1)); }
    else if(e.key==='Delete'||e.key==='Backspace'){
      e.preventDefault();
      if(st.kf){ const L=findL(st.kf.ind); const r=L&&buildRows(L,curLayers()).find(x=>x.type==='prop'&&x.key===st.kf.key); if(r&&r.prop.a){ const i=r.prop.k.indexOf(st.kf.kf); if(i>=0) structural(()=>removeKey(r,i)); } }
      else delLayer();
    }
    else if(mod&&e.key.toLowerCase()==='d'){ e.preventDefault(); dupLayer(); }
    else if(e.key==='Enter'&&st.tool==='pen'&&st.pen.length>=2) penFinish(false);
    else if(e.key==='Escape'&&st.tool==='pen') setTool('select');
  });
  addEventListener('dragover',e=>{ e.preventDefault(); $('#app').classList.add('drop'); });
  addEventListener('dragleave',e=>{ if(!e.relatedTarget) $('#app').classList.remove('drop'); });
  addEventListener('drop',e=>{ e.preventDefault(); $('#app').classList.remove('drop'); const f=e.dataTransfer&&e.dataTransfer.files[0]; if(f) readFile(f); });
}
function boot(){
  setupIcons(); wire();
  let c=null;
  try{ const s=localStorage.getItem('lottie-bench:v1'); if(s) c=JSON.parse(s); }catch(e){}
  try{ loadComp(c||TEMPLATES.bounce(),{initial:true}); }catch(e){ loadComp(TEMPLATES.bounce(),{initial:true}); }
  if(st.comp.layers[0]){ st.sel=st.comp.layers[0].ind; st.expanded[st.sel]=true; }
  setTab('props');
}
boot();
</script>
