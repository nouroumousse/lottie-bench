<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f8">
  <meta name="description" content="A lightweight browser-based Lottie JSON editor with layers, keyframes, easing, and a live preview.">
  <title>Lottie Bench — Motion Editor</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <style>:root{color-scheme:light;box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;background:#fff;color:#202127}[hidden]:not([hidden=until-found i]){display:none!important}</style>
 <style>
:root{
  --bg:#f6f6f8;--panel:#fff;--panel2:#f5f5f7;--line:#e7e8ec;--fg:#24252b;--muted:#858895;
  --accent:#7067f7;--accent-fg:#fff;--danger:#d84d56;--key:#edae45;--input:#fff;
  --bar:#d8d9de;--barsel:#8882ff;--stagebg:#f5f5f7;--ck1:#fff;--ck2:#f0f0f2;--ph:#292833;
  --ui:'Inter',system-ui,-apple-system,sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;width:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--fg);font:13px/1.4 var(--ui);padding:0}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;gap:0;width:100%;height:100dvh;min-height:540px;grid-template-columns:52px 274px minmax(320px,1fr) 272px;grid-template-rows:minmax(320px,1fr) 224px;grid-template-areas:"rail layers stage right" "timeline timeline timeline timeline";background:var(--panel)}
.rail{grid-area:rail;display:flex;flex-direction:column;align-items:center;gap:9px;padding:10px 0;background:#fff;border-right:1px solid var(--line);z-index:6}
.rail-logo{display:grid;place-items:center;width:32px;height:34px;margin-bottom:12px;color:#24242a;font:italic 700 30px/1 Georgia,serif;user-select:none}
.rail-rule{height:1px;width:26px;background:var(--line);margin:0 0 4px}
.rail-btn{width:36px;height:36px;display:grid;place-items:center;border:0;border-radius:8px;background:transparent;color:#626574;padding:0}
.rail-btn:hover{background:#f2f2f5;color:#292a32}
.rail-btn.on{background:#efeeff;color:var(--accent)}
.rail-btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.panel,.stagewrap,.timeline{grid-area:timeline;display:grid;grid-template-rows:80px minmax(0,1fr);min-width:0;min-height:0;overflow:hidden;border-top:1px solid #e5e5e8;background:#fff;z-index:5}
.transport{display:flex;align-items:stretch;height:80px;min-height:80px;padding:0;background:#fff;border-bottom:1px solid #e5e5e8;overflow:hidden}
.transport-left{width:398px;min-width:398px;max-width:398px;display:flex;align-items:center;gap:10px;padding:0 14px;border-right:1px solid #e5e5e8;background:#fff;flex:none}
.timeline-icon{display:grid;place-items:center;width:34px;height:34px;flex:none;border:0;border-radius:8px;background:transparent;color:#202127;padding:0}
.timeline-icon:hover{background:#f4f4f6}
.timeline-icon svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.timeline-icon.record{width:28px;height:34px}
.record-ring{width:20px;height:20px;border:2.5px solid #25262d;border-radius:50%;display:block;position:relative}
.record-ring:after{content:'';position:absolute;inset:4px;border-radius:50%;background:#25262d}
.timeline-icon.loop{width:27px;height:30px;border-radius:6px}
.timeline-icon.loop svg{width:17px;height:17px}
.timeline-icon.loop.on{color:var(--accent);background:#f0efff}
#tFrame{width:74px;height:36px;flex:none;text-align:center;background:#f3f3f5;border:0;border-radius:7px;padding:0 7px;font:500 16px var(--mono);color:#292a32}
.time-separator{font:500 17px var(--mono);color:#2d2e36;margin:0 -3px}
.duration-readout{height:36px;min-width:80px;padding:0 10px;display:flex;align-items:center;border-radius:7px;background:#f3f3f5;color:#282932;font:500 15px var(--mono);white-space:nowrap}
.legacy-controls{display:none}
.ruler-viewport{position:relative;flex:1;min-width:0;overflow:hidden;background:#fff;touch-action:pan-y}
.ruler-track{position:absolute;inset:0 auto 0 0;height:80px;will-change:transform;background:#fff}
.ruler-track .major-tick{position:absolute;top:0;bottom:0;width:1px;border-left:1px solid transparent}
.ruler-track .major-tick:before{content:'';position:absolute;top:42px;left:-2px;width:4px;height:4px;border-radius:50%;background:#d7d8dc}
.ruler-track .major-tick span{position:absolute;top:34px;left:0;transform:translateX(-50%);font:500 15px var(--mono);color:#252630;white-space:nowrap}
.ruler-track .major-tick.first span{transform:none}
.ruler-track .minor-dot{position:absolute;top:43px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:#e0e1e4}
.ruler-tools{position:absolute;right:7px;top:5px;display:flex;align-items:center;gap:6px;padding:3px 5px;background:rgba(255,255,255,.94);border-radius:6px;opacity:.18;transition:opacity .15s}
.ruler-viewport:hover .ruler-tools,.ruler-tools:focus-within{opacity:1}
.ruler-tools select{width:62px;padding:3px 5px;font-size:10px;border-color:#eee}
.ruler-tools label{display:flex;align-items:center;gap:4px;font-size:10px;color:#777}
#tlZoom{width:68px;accent-color:var(--accent)}
.tl-scroll{position:relative;overflow:auto;min-width:0;min-height:0;background:#fff;overscroll-behavior:contain}
#tlinner{position:relative;min-height:100%;width:max-content}
.tr{display:flex;height:46px;border-bottom:1px solid #f0f0f2;min-width:100%}
.tr .lab{position:sticky;left:0;z-index:3;width:398px;min-width:398px;max-width:398px;flex:none;display:flex;align-items:center;gap:10px;padding:0 18px;background:#fff;border-right:1px solid #e8e8eb;overflow:hidden;white-space:nowrap;cursor:pointer;color:#2c2d35;font-size:16px}
.tr .lab .nm{min-width:0;overflow:hidden;text-overflow:ellipsis}
.tr .lab:hover{background:#fafafd}
.tr .lab.sel{background:#f4f3ff;color:#433db2}
.tr .lab.active-item{background:#f0efff;color:#403ab2}
.tr .lab.artboard-lab{font-size:16px}
.tr .lab.item-lab{font-size:15px}
.tr .lab.prop-lab{font-size:14px;color:#888a94;cursor:pointer}
.tr .track{position:relative;flex:none;min-width:200px;height:46px;background:#fff}
.tr .track.clickable{cursor:crosshair}
.tr.headrow{height:46px}
.timeline-glyph{width:20px;height:20px;flex:none;display:grid;place-items:center;color:#292a33}
.timeline-glyph svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.timeline-glyph.artboard{font:italic 700 19px Georgia,serif}
.timeline-glyph.property{font-size:19px;color:#a5a6ae}
.timeline-glyph.layer{font-size:20px}
.track-bar{position:absolute;top:8px;bottom:8px;background:#d7d7d9;border-radius:8px;cursor:grab;min-width:6px}
.track-bar:hover{background:#cfcfd2}
.track-bar.sel{background:#c4c3cc;box-shadow:inset 0 0 0 1px #b7b6c1}
.track-bar .hd{position:absolute;top:0;bottom:0;width:8px;cursor:ew-resize}
.track-bar .hd.l{left:0}.track-bar .hd.r{right:0}
.property-range{position:absolute;left:0;right:0;top:50%;height:2px;background:#d9d9dc;transform:translateY(-50%)}
.kf{position:absolute;top:50%;width:13px;height:13px;margin:-6.5px 0 0 -6.5px;transform:rotate(45deg);background:#d7d7da;border:1.5px solid #b9bac0;border-radius:1px;cursor:grab;z-index:2}
.kf:hover{background:#c6c5ce;border-color:#858591}
.kf.sel{background:var(--accent);border-color:#5b55df;outline:2px solid #e7e5ff;outline-offset:2px}
#ph{position:absolute;top:-52px;bottom:0;width:0;border-left:2px solid #262630;z-index:6;pointer-events:none}
#ph:before{content:attr(data-frame);position:absolute;top:0;left:-20px;min-width:38px;height:34px;padding:0 5px;display:grid;place-items:center;border-radius:10px;background:#24242d;color:#fff;font:500 15px var(--mono);white-space:nowrap}
#ph:after{content:'';position:absolute;top:34px;left:-1px;height:18px;border-left:2px solid #24242d}
@media(max-width:820px){
 .timeline{grid-template-rows:72px 260px;min-height:332px;flex:none}
 .transport{height:72px;min-height:72px}
 .transport-left{width:260px;min-width:260px;max-width:260px;gap:5px;padding:0 7px}
 .timeline-icon{width:28px;height:30px}
 #tFrame{width:58px;font-size:13px;height:32px}
 .duration-readout{min-width:62px;height:32px;padding:0 6px;font-size:12px}
 .time-separator{font-size:14px}
 .tr .lab{width:260px;min-width:260px;max-width:260px;font-size:13px;padding:0 10px;gap:6px}
 .tr .lab.item-lab{font-size:12px}
 .tr .lab.prop-lab{font-size:11px}
 .ruler-tools{opacity:.9}
 .ruler-tools label{display:none}
}
.inspector-head{display:flex;align-items:center;justify-content:space-between;gap:8px;height:54px;min-height:54px;padding:0 13px;border-bottom:1px solid var(--line);background:#fff}
.inspector-title{font-weight:600;color:#343540}
.inspector-actions{display:flex;gap:6px;align-items:center}
.toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:#292a32;color:#fff;padding:9px 14px;border-radius:8px;z-index:50;max-width:90vw;display:none;font-weight:500;box-shadow:0 6px 22px rgba(0,0,0,.15)}
.toast.err{background:var(--danger);color:#fff}
.drop{outline:2px dashed var(--accent);outline-offset:-6px}
@media(max-width:1100px){
 .app{grid-template-columns:48px 230px minmax(260px,1fr) 250px;grid-template-rows:minmax(300px,1fr) 210px}
 .tr .lab{width:278px}
}
@media(max-width:820px){
 html,body{height:auto;min-height:100%;overflow:auto}
 .app{display:flex;flex-direction:column;height:auto;min-height:100vh}
 .rail{height:48px;min-height:48px;flex-direction:row;justify-content:flex-start;padding:0 10px;border-right:0;border-bottom:1px solid var(--line)}
 .rail-logo{margin:0 8px 0 0;width:28px;height:28px;font-size:26px}
 .rail-rule{height:24px;width:1px;margin:0 3px}
 .layers{max-height:220px;min-height:100px;border-right:0;border-bottom:1px solid var(--line)}
 .stagewrap{min-height:510px;height:65vh}
 .right{max-height:560px;min-height:360px;border-left:0;border-top:1px solid var(--line)}
 .timeline{height:260px;min-height:260px;flex:none}
 .workspace-head{padding:0 12px}
 .workspace-actions{gap:4px}
 .workspace-actions select{max-width:112px}
 .stagearea{padding:12px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


<div class="app" id="app">
  <aside class="rail" aria-label="Tools">
    <div class="rail-logo" aria-label="Lottie Bench">ℓ</div>
    <div class="rail-rule"></div>
    <button class="rail-btn on" id="toolSel" type="button" title="Select and move" aria-label="Select and move"></button>
    <button class="rail-btn" id="toolPen" type="button" title="Draw a vector path" aria-label="Draw a vector path"></button>
    <button class="rail-btn" id="layersFocus" type="button" title="Focus layers" aria-label="Focus layers">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 12 9 5 9-5M3 16l9 5 9-5"/></svg>
    </button>
  </aside>

  <section class="panel layers">
    <div class="phead">
      <span class="ttl">Layers</span>
      <select id="addSel" title="Add a layer"><option value="">+ Add</option><option value="rect">Rectangle</option><option value="ellipse">Ellipse</option><option value="star">Star</option><option value="polygon">Polygon</option><option value="solid">Solid</option><option value="null">Null</option></select>
    </div>
    <div class="phead" id="layerTools"></div>
    <div class="crumb" id="crumb" hidden></div>
    <div class="list" id="layerlist" tabindex="0" aria-label="Animation layers"></div>
  </section>

  <section class="stagewrap">
    <div class="workspace-head">
      <div class="workspace-title"><span class="board-mark"></span><span id="docTitle">Artboard 1</span><span class="doc-meta" id="docMeta"></span></div>
      <div class="workspace-actions">
        <select id="tplsel" title="Start a new animation"><option value="">New…</option><option value="blank">Blank</option><option value="pulse">Pulse</option><option value="spinner">Loader ring</option><option value="bounce">Bouncing ball</option></select>
        <button class="btn" id="btnImport" type="button">Import JSON</button>
        <button class="ib" id="btnUndo" type="button" title="Undo (Ctrl+Z)" aria-label="Undo"></button>
        <button class="ib" id="btnRedo" type="button" title="Redo (Ctrl+Shift+Z)" aria-label="Redo"></button>
        <input type="file" id="file" accept=".json,application/json" hidden>
      </div>
    </div>
    <div class="toolbar">
      <span class="note" style="margin:0">Preview</span>
      <span class="sp"></span>
      <button class="ib" id="zOut" type="button" title="Zoom out" aria-label="Zoom out"></button>
      <button class="btn" id="zFit" type="button">Fit</button>
      <button class="ib" id="zIn" type="button" title="Zoom in" aria-label="Zoom in"></button>
      <label class="note" style="margin:0 0 0 8px"><input type="checkbox" id="transp"> Transparent</label>
    </div>
    <div class="stagearea" id="stagearea">
      <div class="canvas" id="canvas">
        <svg class="penlayer" id="penlayer"></svg>
        <div class="sel" id="selbox"></div>
      </div>
    </div>
  </section>

  <section class="panel right">
    <div class="inspector-head">
      <span class="inspector-title">Inspector</span>
      <div class="inspector-actions">
        <button class="btn" id="btnCopy" type="button" title="Copy the animation JSON so you can share it">Share</button>
        <button class="btn primary" id="btnExport" type="button">Export</button>
      </div>
    </div>
    <div class="tabs">
      <button class="tab on" data-tab="props" type="button">Properties</button>
      <button class="tab" data-tab="comp" type="button">Composition</button>
      <button class="tab" data-tab="code" type="button">JSON</button>
    </div>
    <div class="pane" id="paneProps"></div>
    <div class="pane" id="paneComp" hidden></div>
    <div class="pane" id="paneCode" hidden>
      <div class="codebar">
        <button class="btn primary" id="codeApply" type="button">Apply JSON</button>
        <button class="btn" id="codeCopy" type="button">Copy</button>
        <button class="btn" id="codeDl" type="button">Download .json</button>
        <button class="btn" id="codeSvg" type="button">Frame as .svg</button>
        <label class="note" style="margin:0"><input type="checkbox" id="codeMin"> Minify</label>
      </div>
      <textarea class="code" id="codeText" spellcheck="false" aria-label="Animation JSON"></textarea>
      <div class="stat" id="codeStat"></div>
    </div>
  </section>

  <section class="timeline" aria-label="Animation timeline">
    <div class="transport">
      <div class="transport-left" id="timeline-left">
        <button class="timeline-icon" id="tPlay" type="button" title="Play / pause (Space)" aria-label="Play or pause"></button>
        <button class="timeline-icon record" id="tRecord" type="button" title="Insert keyframes for animated properties" aria-label="Insert keyframes"><span class="record-ring"></span></button>
        <input type="number" class="frame" id="tFrame" title="Current time in frames" step="0.01" min="0">
        <span class="time-separator">/</span>
        <span class="duration-readout" id="timeDuration">2.00 s</span>
        <button class="timeline-icon loop" id="tLoop" type="button" title="Toggle looping" aria-label="Toggle looping"></button>
        <span class="legacy-controls" aria-hidden="true">
          <button class="ib" id="tFirst" type="button" title="Go to start"></button>
          <button class="ib" id="tLast" type="button" title="Go to end"></button>
        </span>
        <span class="timefld" id="timefld" hidden></span>
      </div>
      <div class="ruler-viewport" id="tlrulerViewport">
        <div class="ruler-track" id="tlruler"></div>
        <div class="ruler-tools">
          <select id="tSpeed" title="Preview speed"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select>
          <label title="Timeline zoom">Zoom <input type="range" id="tlZoom" min="1" max="12" step="0.5" value="1"></label>
        </div>
      </div>
    </div>
    <div class="tl-scroll" id="tlscroll"><div id="tlinner"></div></div>
  </section>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/lottie-web@5.13.0/build/player/lottie.min.js"></script>
<script type="module" src="./src/app.mjs"></script>

</body></html>
